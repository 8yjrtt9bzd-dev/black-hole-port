name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.8

      - name: Build
        run: |
          FOUND=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "No settings.gradle anywhere in the repo. The project files did not upload."
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Building in $DIR"
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: blackholeport-jar
          path: out/*.jar
          if-no-files-found: error
